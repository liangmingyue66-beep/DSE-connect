<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 志愿填报助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>DSE 志愿填报助手</h1>
      <span class="subtitle">香港文凭试 · 内地高校查询</span>
    </header>
    <div id="chat" class="chat">
      <div class="msg assistant">你好！我是 DSE 志愿填报助手。可以问我：<br>「我 4/5/4 想去广东读计算机」<br>「什么时候报名」<br>「校长推荐计划有什么要求」</div>
    </div>
    <div class="input-bar">
      <input id="input" type="text" placeholder="例如：我 4/5/4 想去广东读计算机" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
